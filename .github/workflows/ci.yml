name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: proxy/go.mod

      - name: Test
        working-directory: proxy
        run: go test -race ./...

      - name: Vet
        working-directory: proxy
        run: go vet ./...

      - name: Build container
        run: docker build --file proxy/Dockerfile --tag sub2api-fast-toggle:ci .
